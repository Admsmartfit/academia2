<div class="px-2 py-2 flex-grow-1">
  <span class="sidebar-section">Principal</span>
  <a href="{{ url_for('provider.dashboard') }}"
     class="nav-link {{ 'active' if request.endpoint == 'provider.dashboard' }}">
    <i class="fas fa-tachometer-alt"></i> Dashboard
  </a>
  <a href="{{ url_for('provider.calendar') }}"
     class="nav-link {{ 'active' if request.endpoint == 'provider.calendar' }}">
    <i class="far fa-calendar-alt"></i> Calendário
  </a>

  <span class="sidebar-section mt-2">Configuração</span>
  <a href="{{ url_for('provider.templates_list') }}"
     class="nav-link {{ 'active' if request.endpoint == 'provider.templates_list' }}">
    <i class="fas fa-layer-group"></i> Templates
  </a>

  {% if current_user.role == 'admin' %}
  <span class="sidebar-section mt-2">Administração</span>
  <a href="{{ url_for('admin.leads') }}"
     class="nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('admin.lead') }}">
    <i class="fas fa-funnel-dollar"></i> Funil de Leads
  </a>
  <a href="{{ url_for('admin.users') }}"
     class="nav-link {{ 'active' if request.endpoint == 'admin.users' }}">
    <i class="fas fa-users-cog"></i> Usuários
  </a>
  {% endif %}
</div>

<div class="sidebar-footer">
  <a href="{{ url_for('auth.logout') }}">
    <i class="fas fa-sign-out-alt"></i> Sair
  </a>
</div>
